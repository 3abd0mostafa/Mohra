<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎉 عيد ميلاد سعيد 🎉</title>

<!-- ايقونة القلب -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    overflow-x:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    color:white;
    text-align:center;
}

/* شريط الازرار */

nav{
    padding:20px;
}

nav button{
    padding:12px 20px;
    border:none;
    border-radius:15px;
    margin:5px;
    cursor:pointer;
    font-size:18px;
    background:white;
}

/* الصفحات */

section{
    display:none;
    min-height:100vh;
    padding:40px;
}

#home{
    display:block;
}

/* العنوان */

h1{
    font-size:60px;
    margin-top:50px;
}

/* الكيكة */

.cake{
    font-size:100px;
    margin-top:30px;
    position:relative;
}

/* الشمعة */

.flame{
    width:15px;
    height:30px;
    background:orange;
    border-radius:50%;
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    animation:flicker .2s infinite;
}

@keyframes flicker{

    0%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.3);
    }

    100%{
        transform:translateX(-50%) scale(1);
    }
}

/* القلوب */

.heart{
    position:fixed;
    bottom:-50px;
    animation:floatUp linear forwards;
    pointer-events:none;
    z-index:999;
}

@keyframes floatUp{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}
/* الرسالة */

.message-box{
    background:rgba(255,255,255,0.2);
    width:80%;
    margin:auto;
    padding:30px;
    border-radius:20px;
    margin-top:50px;
}

.message-box img{
    width:250px;
    border-radius:20px;
    margin:20px 0;
}

/* زر المفاجأة */

.surprise-btn{
    margin-top:30px;
    padding:15px 25px;
    border:none;
    border-radius:20px;
    font-size:20px;
    cursor:pointer;
}

/* صفحة الدخول */

#login{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.8);
    z-index:999;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#login input{
    padding:12px;
    border:none;
    border-radius:10px;
    margin:10px;
    width:250px;
}

#login button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

</style>
</head>

<body>

<!-- صفحة الدخول -->

<div id="login">

    <h2>💖 ادخل الاسم 💖</h2>

    <input type="text" placeholder="اكتب الاسم">

    <button onclick="openSite()">دخول 🎉</button>

</div>

<!-- الموسيقى -->

<audio id="music" loop>

    <source src="music.mpeg" type="audio/mpeg">

</audio>

<!-- الكونفيتي -->

<canvas id="confetti"></canvas>

<!-- الازرار -->

<nav>

    <button onclick="showPage('home')">🎉 الرئيسية</button>

    <button onclick="showPage('message')">💌 رسالة</button>

    <button onclick="playMusic()">🎵 موسيقى</button>

</nav>

<!-- الصفحة الرئيسية -->

<section id="home">

    <h1>🎂 Happy Birthday 🎂</h1>

    <h2 id="typing"></h2>

    <div class="cake">

        🎂

        <div class="flame"></div>

    </div>

    <button class="surprise-btn" onclick="surprise()">

        🎁 اضغطي للمفاجأة

    </button>

    <h2 id="surpriseText"></h2>

</section>

<!-- صفحة الرسالة -->

<section id="message">

    <div class="message-box">

        <h2>💌 رسالة خاصة 💌</h2>

        <!-- حط صورتك هنا -->
        <img src="WhatsApp Image 2026-05-07 at 7.43.28 PM.jpeg">

        <!-- اكتب الرسالة هنا -->

        <p style="color: black;
        font-size: large;">

           ❤️❤️❤️❤️❤️كل سنة وانتي طيبة ياروحي و عقبال سنين كتيره و احنا مع بعض و تحققي كل الي نفسك فيه و اشوفك من اشطر الناس و كل سنة وانتي طيبه و قلبك ابيض و كله بيحبك

        </p>

    </div>

</section>

<script>

/* فتح الموقع */

function openSite(){

    document.getElementById("login").style.display="none";

    startTyping();
}

/* تغيير الصفحات */

function showPage(pageId){

    document.getElementById("home").style.display="none";

    document.getElementById("message").style.display="none";

    document.getElementById(pageId).style.display="block";
}

/* تشغيل الموسيقى */

function playMusic(){

    document.getElementById("music").play();
}

/* المفاجأة */

function surprise(){

    document.getElementById("surpriseText").innerHTML =

    "💖 كل سنة وانتي أجمل حاجة في حياتي 💖";
}

/* الكتابة المتحركة */

let text = "🎉 عيد ميلاد 18 سعيد 🎉";

let i = 0;

function startTyping(){

    let speed = setInterval(function(){

        document.getElementById("typing").innerHTML += text[i];

        i++;

        if(i >= text.length){

            clearInterval(speed);
        }

    },100);
}

/* القلوب الطائرة */
function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    // مكان عشوائي
    heart.style.left = Math.random() * 100 + "vw";

    // حجم عشوائي
    let size = Math.random() * 30 + 20;

    heart.style.fontSize = size + "px";

    // مدة الحركة
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {

        heart.remove();

    },6000);
}

// إنشاء قلوب باستمرار
setInterval(createHeart,200);

setInterval(createHeart,300);

/* الكونفيتي */

const canvas = document.getElementById("confetti");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;

canvas.height = window.innerHeight;

let pieces = [];

for(let i=0;i<120;i++){

    pieces.push({

        x:Math.random()*canvas.width,

        y:Math.random()*canvas.height,

        r:Math.random()*6+2
    });
}

function drawConfetti(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    pieces.forEach(function(p){

        ctx.beginPath();

        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        ctx.fill();

        p.y += 2;

        if(p.y > canvas.height){

            p.y = 0;
        }
    });

    requestAnimationFrame(drawConfetti);
}

drawConfetti();

</script>

</body>
</html>
